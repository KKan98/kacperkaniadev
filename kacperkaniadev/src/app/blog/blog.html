@for (blog of blogs; track blog.slug) {
  <article class="blog-post">
    <h1>{{ blog.title }}</h1>
    <div class="blog-summarize">
      {{ blog.summary }}
    </div>
    <section class="blog-footer">
      <span>{{ blog.footer.creationDate | date:'mediumDate'}} · {{ blog.footer.readingTime }} min · {{ blog.footer.words }} words</span> 
    </section>
    <a class="entry-link" [aria-label]="blog.title"  [href]="blog.fileName"></a>
  </article>
}
